<svg xmlns="http://www.w3.org/2000/svg" width="390" height="602" viewBox="0 0 390 602" role="img" aria-labelledby="title description">
<title id="title">Hub observed heights</title>
<desc id="description">Only sourced height observations, ordered by date.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17212b}</style>
<rect width="390" height="602" rx="12" fill="#f8fafc"/>
<text x="24" y="38" font-size="23" font-weight="bold" text-anchor="start">Hub observed heights</text>
<text x="24" y="68" font-size="16" font-weight="normal" text-anchor="start">Recorded heights · November 2026</text>
<text x="24" y="104" font-size="18" font-weight="bold" text-anchor="start">15 Nov</text>
<text x="366" y="104" font-size="21" font-weight="bold" text-anchor="end">13,070</text>
<text x="24" y="130" font-size="17" font-weight="normal" text-anchor="start">Replacement sync</text>
<line x1="24" y1="153" x2="366" y2="153" stroke="#bdc5cd"/>
<circle cx="108.64" cy="153" r="6" fill="#34424f"/>
<text x="24" y="192" font-size="18" font-weight="bold" text-anchor="start">17 Nov</text>
<text x="366" y="192" font-size="21" font-weight="bold" text-anchor="end">40,631</text>
<text x="24" y="218" font-size="17" font-weight="normal" text-anchor="start">Four validators sign</text>
<line x1="24" y1="241" x2="366" y2="241" stroke="#bdc5cd"/>
<circle cx="287.11" cy="241" r="6" fill="#34424f"/>
<text x="24" y="280" font-size="18" font-weight="bold" text-anchor="start">18 Nov</text>
<text x="366" y="280" font-size="21" font-weight="bold" text-anchor="end">52,814</text>
<text x="24" y="306" font-size="17" font-weight="normal" text-anchor="start">Height watch</text>
<line x1="24" y1="329" x2="366" y2="329" stroke="#bdc5cd"/>
<circle cx="366.00" cy="329" r="6" fill="#34424f"/>
<text x="24" y="368" font-size="16" font-weight="normal" text-anchor="start">Height scale: 0 at left; 52,814 at</text>
<text x="24" y="390" font-size="16" font-weight="normal" text-anchor="start">right.</text>
<text x="24" y="422" font-size="16" font-weight="normal" text-anchor="start">Sparse observations only. No</text>
<text x="24" y="444" font-size="16" font-weight="normal" text-anchor="start">interpolation, rate or uptime</text>
<text x="24" y="466" font-size="16" font-weight="normal" text-anchor="start">inferred. Rows are ordered</text>
<text x="24" y="488" font-size="16" font-weight="normal" text-anchor="start">snapshots.</text>
<text x="24" y="520" font-size="16" font-weight="normal" text-anchor="start">Source: TraderSwift build and chain records.</text>
</svg>
