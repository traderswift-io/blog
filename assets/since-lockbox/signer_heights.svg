<svg xmlns="http://www.w3.org/2000/svg" width="390" height="690" viewBox="0 0 390 690" role="img" aria-labelledby="title description">
<title id="title">Signer-1 observed heights</title>
<desc id="description">Only sourced height observations, ordered by date.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17212b}</style>
<rect width="390" height="690" rx="12" fill="#f8fafc"/>
<text x="24" y="38" font-size="23" font-weight="bold" text-anchor="start">Signer-1 observed heights</text>
<text x="24" y="68" font-size="16" font-weight="normal" text-anchor="start">Recorded heights · November 2026</text>
<text x="24" y="104" font-size="18" font-weight="bold" text-anchor="start">14 Nov</text>
<text x="366" y="104" font-size="21" font-weight="bold" text-anchor="end">160,839</text>
<text x="24" y="130" font-size="17" font-weight="normal" text-anchor="start">Admin accepted</text>
<line x1="24" y1="153" x2="366" y2="153" stroke="#bdc5cd"/>
<circle cx="179.19" cy="153" r="6" fill="#34424f"/>
<text x="24" y="192" font-size="18" font-weight="bold" text-anchor="start">15 Nov</text>
<text x="366" y="192" font-size="21" font-weight="bold" text-anchor="end">199,695</text>
<text x="24" y="218" font-size="17" font-weight="normal" text-anchor="start">Health observation</text>
<line x1="24" y1="241" x2="366" y2="241" stroke="#bdc5cd"/>
<circle cx="216.68" cy="241" r="6" fill="#34424f"/>
<text x="24" y="280" font-size="18" font-weight="bold" text-anchor="start">17 Nov</text>
<text x="366" y="280" font-size="21" font-weight="bold" text-anchor="end">353,836</text>
<text x="24" y="306" font-size="17" font-weight="normal" text-anchor="start">Records drained</text>
<line x1="24" y1="329" x2="366" y2="329" stroke="#bdc5cd"/>
<circle cx="365.40" cy="329" r="6" fill="#34424f"/>
<text x="24" y="368" font-size="18" font-weight="bold" text-anchor="start">17 Nov</text>
<text x="366" y="368" font-size="21" font-weight="bold" text-anchor="end">354,455</text>
<text x="24" y="394" font-size="17" font-weight="normal" text-anchor="start">Old policy revoked</text>
<line x1="24" y1="417" x2="366" y2="417" stroke="#bdc5cd"/>
<circle cx="366.00" cy="417" r="6" fill="#34424f"/>
<text x="24" y="456" font-size="16" font-weight="normal" text-anchor="start">Height scale: 0 at left; 354,455 at</text>
<text x="24" y="478" font-size="16" font-weight="normal" text-anchor="start">right.</text>
<text x="24" y="510" font-size="16" font-weight="normal" text-anchor="start">Sparse observations only. No</text>
<text x="24" y="532" font-size="16" font-weight="normal" text-anchor="start">interpolation, rate or uptime</text>
<text x="24" y="554" font-size="16" font-weight="normal" text-anchor="start">inferred. Rows are ordered</text>
<text x="24" y="576" font-size="16" font-weight="normal" text-anchor="start">snapshots.</text>
<text x="24" y="608" font-size="16" font-weight="normal" text-anchor="start">Source: TraderSwift build and chain records.</text>
</svg>
